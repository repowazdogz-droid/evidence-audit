[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-audit"
version = "0.1.0"
description = "Grade recorded verification outputs by what they actually establish."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.scripts]
evidence-audit = "evidence_audit.cli:main"

[tool.setuptools]
packages = ["evidence_audit", "evidence_audit.analyzers", "evidence_audit.lean"]

[tool.pytest.ini_options]
testpaths = ["tests"]
